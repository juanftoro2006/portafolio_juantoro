name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar dependencias y construir
        uses: withastro/action@v3
        # Este action detecta automaticamente package.json / package-lock.json
        # dentro de site-v2 si se le indica la carpeta raiz del proyecto.
        with:
          path: site-v2
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # El job de arriba ya incluye el deploy via withastro/action + deploy-pages.
  # Se deja como un solo job para simplicidad; se puede separar en build/deploy
  # si mas adelante se agregan pasos extra (tests, lint, etc).
